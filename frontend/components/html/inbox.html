<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldStone Bank – Inbox</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>

    <link rel="stylesheet" href="../css/inbox.css">
    <link rel="stylesheet" href="../css/notifications.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-icon">GS</div>
        <span class="logo-name">GoldStone Bank</span>
    </div>
    <div class="header-right">
        <div class="notif-wrapper">
            <button class="bell-btn" id="bellBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                </svg>
                <span class="bell-badge hidden" id="bellBadge">0</span>
            </button>
            <div class="notif-dropdown" id="notifDropdown">
                <div class="notif-dropdown-header">
                    <span>Notifications</span>
                    <button class="read-all-btn" id="readAllBtn">Read all</button>
                </div>
                <div class="notif-list" id="notifList"></div>
                <div class="notif-dropdown-footer">
                    <button class="show-all-btn" id="showAllBtn">Show all</button>
                </div>
            </div>
        </div>
        <span class="admin-badge">Admin Panel</span>
    </div>
</header>

<main class="main">
    <div class="section-header">
        <div>
            <div class="section-title">Inbox</div>
            <div class="section-subtitle" id="inboxSubtitle"></div>
        </div>
        <div class="inbox-actions">
            <button class="inbox-read-all-btn" id="inboxReadAll">Mark all as read</button>
            <button class="logout-btn" id="goBack">Go back</button>
        </div>
    </div>

    <div class="inbox-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="unread">Unread</button>
        <button class="filter-btn" data-filter="read">Read</button>
    </div>

    <div class="inbox-table-card">
        <div id="inboxList"></div>
    </div>
</main>

<footer class="footer">GoldStone Bank 2026</footer>

<script src="../js/notifications.js"></script>
<script src="../js/inbox.js"></script>

</body>
</html>
