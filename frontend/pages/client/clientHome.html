<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Page — GoldStone Bank</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="../../components/js/notifications.js"></script>

    <link rel="stylesheet" href="../../css/client/clientHome.css" />
    <link rel="stylesheet" href="../../components/css/inbox.css">
    <link rel="stylesheet" href="../../components/css/notifications.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-icon">GS</div>
        <span class="logo-name">GoldStone Bank</span>
    </div>
    <div class="header-right">
        <div class="notif-wrapper">
            <button class="bell-btn" id="bellBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                </svg>
                <span class="bell-badge hidden" id="bellBadge">0</span>
            </button>
            <div class="notif-dropdown" id="notifDropdown">
                <div class="notif-dropdown-header">
                    <span>Notifications</span>
                    <button class="read-all-btn" id="readAllBtn">Read all</button>
                </div>
                <div class="notif-list" id="notifList"></div>
                <div class="notif-dropdown-footer">
                    <button class="show-all-btn" id="showAllBtn">Show all</button>
                </div>
            </div>
        </div>
        <span class="admin-badge">Client Panel</span>
        <button class="logout-btn">Logout</button>
    </div>
</header>

<main class="main">

    <div class="top-card">
        <div class="client-info">
            <div class="avatar" id="clientAvatar"></div>
            <div>
                <div class="client-name" id="clientName"></div>
                <div class="client-id">Client ID: <span id="clientId"></span></div>
            </div>
        </div>
        <div class="balance-block">
            <div class="balance-label">Available Balance</div>
            <div class="balance-amount" id="clientBalance">ALL 0.00</div>
            <div class="balance-sub" id="balanceDate"></div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn-transfer">Transfer Money</button>

        <button class="changePassword-btn">Change password</button>
    </div>

    <div class="transactions-section">
        <div class="section-header">
            <div>
                <div class="section-title">Transaction History</div>
                <div class="section-sub">All incoming and outgoing transfers</div>
            </div>
            <span class="tx-count" id="txCount">0 transactions</span>
        </div>

        <div class="table-card">
            <table>
                <thead>
                <tr>
                    <th>Tx ID</th>
                    <th>Type</th>
                    <th>Counterparty ID</th>
                    <th>Description</th>
                    <th>Date</th>
                    <th class="col-right">Amount (ALL)</th>
                </tr>
                </thead>
                <tbody id="txTableBody">
                <tr class="empty-row">
                    <td colspan="6">No transactions yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer class="footer">
    <p>GoldStone Bank 2026</p>
</footer>

<script src="../../js/client/clientHome.js"></script>

</body>
</html>
