<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banker Panel</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="../../components/js/notifications.js"></script>

    <link rel="stylesheet" href="/css/banker/bankerHome.css">
    <link rel="stylesheet" href="../../components/css/inbox.css">
    <link rel="stylesheet" href="../../components/css/notifications.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-icon">GS</div>
        <span class="logo-name">GoldStone Bank</span>
    </div>
    <div class="header-right">
        <div class="notif-wrapper">
            <button class="bell-btn" id="bellBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                </svg>
                <span class="bell-badge hidden" id="bellBadge">0</span>
            </button>
            <div class="notif-dropdown" id="notifDropdown">
                <div class="notif-dropdown-header">
                    <span>Notifications</span>
                    <button class="read-all-btn" id="readAllBtn">Read all</button>
                </div>
                <div class="notif-list" id="notifList"></div>
                <div class="notif-dropdown-footer">
                    <button class="show-all-btn" id="showAllBtn">Show all</button>
                </div>
            </div>
        </div>
        <span class="admin-badge">Banker Panel</span>
    </div>
</header>

<main class="main">
    <div class="section-header">
        <div>
            <div class="section-title">Client</div>
        </div>
        <div class="section-actions">
            <button class="add-btn">+ Add Client</button>
            <button class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Balance</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr>

            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer class="footer">GoldStone Bank 2026</footer>

<script src="/js/banker/bankerHome.js"></script>

</body>
</html>
