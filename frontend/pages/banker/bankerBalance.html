<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Balance</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="../../css/banker/bankerBalance.css"/>
</head>
<body>


<header class="header">
    <div class="logo">
        <div class="logo-icon">B</div>
        <span class="logo-name">BankingApp</span>
    </div>
    <span class="admin-badge">Banker</span>
</header>


<main class="main">
    <div class="main-inner">

        <div class="section-header">
            <div>

                <div class="section-subtitle" id="clientMeta">—</div>
            </div>

        </div>

        <div class="login-card">


            <div class="balance-display">
                <div class="balance-label">Current Balance</div>
                <div class="balance-amount" id="balanceDisplay">$0.00</div>
            </div>


            <div class="field-group">
                <label for="amountInput">Amount</label>
                <input
                        type="number"
                        id="amountInput"
                        placeholder="Enter amount..."
                        min="0"
                        step="0.01"
                />
            </div>


            <div class="btn-row">
                <button class="action-add" id="addBtn">＋ Add</button>
                <button class="action-subtract" id="subtractBtn">－ Subtract</button>

            </div>
            <button class="balance-back-btn" id="goBack">← Back</button>

            <div class="alert-box" id="alertBox"></div>

        </div>
    </div>
</main>

<footer class="footer">GoldStone Bank 2026</footer>

<script src="/js/banker/bankerBalance.js"></script>
</body>
</html>
